name: Actualizar lenguajes

on:
  schedule:
    - cron: '17 8 * * *' # 03:17 en Colombia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-language-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio de perfil
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generar tarjeta
        env:
          LANGUAGES_TOKEN: ${{ secrets.LANGUAGES_TOKEN }}
        run: python3 scripts/generate_languages.py

      - name: Publicar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/languages.svg
          if git diff --cached --quiet; then
            echo 'Sin cambios en los lenguajes.'
          else
            git commit -m 'Actualizar estadísticas de lenguajes'
            git push origin HEAD
          fi
